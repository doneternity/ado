name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Deploy one commit at a time, in order; never cancel a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Both jobs deploy exactly the commit CI tested (workflow_run.head_sha), not
# whatever main points at by the time this runs.
jobs:
  deploy-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm install -g vercel
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          cd frontend && npm ci && cd ..
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # The Go backend runs on Koyeb. With Koyeb's own autodeploy turned off, this
  # is the only thing that deploys it, so a commit that fails CI never ships.
  # Koyeb health-checks the new deployment and keeps the old one if it fails.
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the tested commit to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE_ID: ${{ vars.KOYEB_SERVICE_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Koyeb's autodeploy is off, so skipping here means the backend silently
          # falls behind the frontend. Fail loudly instead, naming what's missing.
          missing=""
          [ -n "$KOYEB_TOKEN" ] || missing="$missing KOYEB_TOKEN (repo Settings > Secrets and variables > Actions > Secrets tab)"
          [ -n "$KOYEB_SERVICE_ID" ] || missing="$missing KOYEB_SERVICE_ID (same page > Variables tab, not Secrets)"
          if [ -n "$missing" ]; then
            echo "::error::Backend not deployed. Missing:$missing"
            exit 1
          fi
          curl -fsS -X POST "https://app.koyeb.com/v1/services/$KOYEB_SERVICE_ID/redeploy" \
            -H "Authorization: Bearer $KOYEB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\": \"$SHA\"}" > /dev/null
          echo "Requested Koyeb deploy of $SHA"
