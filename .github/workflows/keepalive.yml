name: Keepalive
on:
  schedule:
    - cron: '17 6 * * *' # daily
  workflow_dispatch:

# Free tiers reclaim idle resources: Supabase pauses after ~7 days without
# activity and Upstash deletes inactive Redis databases. /api/health/deep runs
# a real query against both, which counts as activity.
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deep health
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            https://adoai.space/api/health/deep
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling via the API resets that timer, so this job keeps itself alive.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
